<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080' viewBox='0 0 1920 1080'>
  <defs>
    <linearGradient id='grad1' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#4c1d95' stop-opacity='0.7' />
      <stop offset='100%' stop-color='#1d4ed8' stop-opacity='0.1' />
    </linearGradient>
    <linearGradient id='grad2' x1='100%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#2563eb' stop-opacity='0.6' />
      <stop offset='100%' stop-color='#4c1d95' stop-opacity='0.1' />
    </linearGradient>
    <linearGradient id='grad3' x1='0%' y1='100%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#4f46e5' stop-opacity='0.6' />
      <stop offset='100%' stop-color='#1e40af' stop-opacity='0.1' />
    </linearGradient>
    <pattern id='dots' x='0' y='0' width='40' height='40' patternUnits='userSpaceOnUse' patternTransform='rotate(-45)'>
      <circle cx='4' cy='4' r='4' fill='#4f46e5' opacity='0.4' />
    </pattern>
    <pattern id='dots2' x='0' y='0' width='30' height='30' patternUnits='userSpaceOnUse' patternTransform='rotate(-45)'>
      <circle cx='3' cy='3' r='3' fill='#2563eb' opacity='0.4' />
    </pattern>
  </defs>

  <!-- Dot patterns in corners -->
  <rect x='100' y='100' width='400' height='400' fill='url(#dots)' />
  <rect x='1400' y='100' width='400' height='300' fill='url(#dots2)' />
  <rect x='100' y='600' width='300' height='400' fill='url(#dots2)' />
  <rect x='1300' y='600' width='500' height='400' fill='url(#dots)' />

  <g transform='rotate(-45 960 540)'>
    <!-- Top Left -->
    <rect x='100' y='150' width='600' height='80' rx='40' fill='url(#grad1)' />
    <rect x='250' y='280' width='400' height='50' rx='25' fill='url(#grad2)' />
    <rect x='50' y='380' width='350' height='100' rx='50' fill='none' stroke='#2563eb' stroke-width='6' opacity='0.4' />
    <rect x='450' y='420' width='500' height='60' rx='30' fill='url(#grad3)' />

    <!-- Top Right -->
    <rect x='1300' y='100' width='450' height='90' rx='45' fill='url(#grad2)' />
    <rect x='1150' y='250' width='350' height='60' rx='30' fill='none' stroke='#4f46e5' stroke-width='6' opacity='0.4' />
    <rect x='1550' y='350' width='400' height='70' rx='35' fill='url(#grad1)' />
    
    <!-- Bottom Left -->
    <rect x='50' y='650' width='500' height='70' rx='35' fill='url(#grad2)' />
    <rect x='200' y='800' width='350' height='50' rx='25' fill='none' stroke='#4c1d95' stroke-width='6' opacity='0.4' />
    <rect x='350' y='900' width='450' height='90' rx='45' fill='url(#grad3)' />

    <!-- Bottom Right -->
    <rect x='1250' y='600' width='550' height='80' rx='40' fill='url(#grad1)' />
    <rect x='1400' y='750' width='400' height='60' rx='30' fill='none' stroke='#2563eb' stroke-width='6' opacity='0.4' />
    <rect x='1100' y='850' width='350' height='70' rx='35' fill='url(#grad2)' />
    <rect x='1600' y='950' width='450' height='100' rx='50' fill='url(#grad3)' />
  </g>
</svg>
